<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="kirpiGrad" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="neonSpine" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="kirpiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="20" y="20" width="200" height="200" rx="52" fill="#141416" stroke="#2c2c34" stroke-width="2.5" />
  
  <!-- Stylized Geometric "K" / Kirpi Quill spikes -->
  <g filter="url(#kirpiGlow)">
    <!-- Main stem -->
    <rect x="68" y="65" width="22" height="110" rx="11" fill="url(#kirpiGrad)" />
    
    <!-- Top quill / arm -->
    <path d="M78 120 L154 74 C160 70 168 76 166 83 L152 108 L100 135 Z" fill="url(#neonSpine)" />
    
    <!-- Bottom quill / arm -->
    <path d="M96 115 L156 162 C163 167 160 176 151 176 L130 176 L76 130 Z" fill="url(#kirpiGrad)" />
    
    <!-- Hedgehog Snout / Accent Eye Dot -->
    <circle cx="172" cy="120" r="7" fill="#ffffff" />
    <circle cx="174" cy="120" r="3.5" fill="#a855f7" />
  </g>
</svg>
